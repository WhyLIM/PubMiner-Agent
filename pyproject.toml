[project]
name = "pubminer-agent"
version = "0.1.0"
description = "PubMiner Evidence Agent: bounded biomedical evidence agent + pubex acquisition SDK + webui"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.27",
    "biopython>=1.81",
    "pandas>=2.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[project.scripts]
pubminer-api = "pubminer.main_api:main"
pubminer-agent = "pubminer.agent_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
asyncio_mode = "auto"
